name: deploy-book

on:
  push:
    branches:
      - master
      - main


# This job installs dependencies, builds the book, and pushes it to `gh-pages`
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v3

      # Install dependencies
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          pip install jupyter-book
          pip install -r book/requirements.txt
          pip install --upgrade nbformat
      - name: cache executed notebooks
        uses: actions/cache@v3
        with:
          path: book/_build/.jupyter_cache
          key: jupyter-book-cache-${{ hashFiles('requirements.txt') }}
      # Build the book
      - name: Build the book
        run: |
          export OMP_NUM_THREADS=1  # Prevents multi-threading issues
          export MKL_NUM_THREADS=1
          export NUMEXPR_NUM_THREADS=1
          jupyter-book build book --all

      - name: Check if build folder exists
        run: |
          ls -l book/_build/html || echo "Directory does not exist!"
      - name: Set up Git user
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
      - name: Deploy to `gh-pages`
        run: |
          git checkout --orphan gh-pages
          git rm -rf .
          cp -r book/_build/html/* .
          touch .nojekyll
          git add .
          git commit -m "Deploy website"
          git push --force origin gh-pages